<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo Sou Bela</title>

<style>
:root{
--bg:#fff9fc;
--card:#fff;
--text:#222;
--muted:#6b6b6b;
--primary:#d63384;
--primary2:#b7256e;
--border:#f1d2e2;
--shadow:0 12px 35px rgba(214,51,132,.12);
--radius:22px
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(180deg,#fff9fc 0%,#fff 100%);
color:var(--text)
}

.wrap{
max-width:1400px;
margin:0 auto;
padding:18px
}

.hero{
display:grid;
grid-template-columns:1.2fr .8fr;
gap:18px;
align-items:center;
margin-bottom:18px
}

.brand,.hero-side,.toolbar,.card{
background:rgba(255,255,255,.95);
border:1px solid var(--border);
border-radius:var(--radius);
box-shadow:var(--shadow)
}

.brand{
padding:18px;
display:flex;
gap:18px;
align-items:center;
min-height:160px
}

.brand img{
width:min(250px,40vw);
max-height:140px;
object-fit:contain;
display:block
}

.brand-copy h1{
margin:0 0 8px;
font-size:clamp(24px,3vw,38px);
color:var(--primary)
}

.brand-copy p{
margin:0;
color:var(--muted);
line-height:1.5;
font-size:14px
}

.hero-side{
padding:16px;
display:grid;
gap:10px;
min-height:160px;
background:linear-gradient(180deg,rgba(214,51,132,.08),rgba(255,255,255,.96))
}

.toolbar{
display:grid;
grid-template-columns:1.4fr .7fr auto;
gap:12px;
align-items:center;
padding:14px;
margin-bottom:18px
}

.toolbar input,.toolbar select{
width:100%;
border:1px solid #efd0de;
background:#fff;
border-radius:14px;
padding:12px 13px;
font-size:14px
}

.btn{
border:0;
border-radius:14px;
padding:12px 14px;
font-weight:700;
cursor:pointer;
text-decoration:none;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px
}

.btn-primary{
background:var(--primary);
color:#fff
}

.btn-ghost{
background:#fff;
color:var(--primary);
border:1px solid var(--border)
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:16px
}

.card{
overflow:hidden;
display:flex;
flex-direction:column
}

.card-top{
padding:12px 12px 0;
display:grid;
gap:10px
}

.badge{
display:inline-flex;
align-self:flex-start;
background:rgba(214,51,132,.95);
color:#fff;
padding:7px 10px;
border-radius:999px;
font-weight:800;
font-size:12px
}

.titles{
display:grid;
gap:3px
}

.titles .ref{
font-weight:900;
font-size:17px;
color:var(--primary)
}

.titles .name{
font-size:14px;
color:#333
}

.photo-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.photo-box{
border:1px dashed #ebbed2;
border-radius:14px;
padding:8px;
background:#fffafc;
display:grid;
gap:6px
}

.photo-label{
display:flex;
justify-content:space-between;
font-size:11px;
font-weight:800;
color:#7c5265
}

.thumb{
aspect-ratio:1/1;
background:#f6f6f6;
border:1px solid #f0dbe4;
border-radius:10px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
min-height:105px
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
display:block;
cursor:pointer
}

.card-body{
padding:12px;
display:grid;
gap:10px
}

.small{
font-size:12px;
color:#7c5265
}

.empty{
padding:28px;
text-align:center;
border:1px dashed #ebbdd1;
border-radius:var(--radius);
color:#80576b;
background:#fff
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
display:none;
align-items:center;
justify-content:center;
padding:18px;
z-index:1000
}

.modal.open{
display:flex
}

.modal img{
max-width:min(100%,1100px);
max-height:90vh;
border-radius:18px;
background:#fff
}

.modal .close{
position:fixed;
top:18px;
right:18px;
width:46px;
height:46px;
border-radius:999px;
background:#fff;
font-size:24px;
border:none;
cursor:pointer
}

@media (max-width:900px){

.hero,.toolbar{
grid-template-columns:1fr
}

.photo-grid{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">

<div class="brand">
<img src="logo.png" alt="Logo">

<div class="brand-copy">
<h1>Catálogo Sou Bela</h1>
<p>Catálogo online com download de fotos dos modelos.</p>
</div>
</div>

<div class="hero-side">
<strong>Catálogo interno e clientes</strong>
<span>Visualize frente e costas dos modelos e baixe as fotos.</span>
</div>

</div>

<div class="toolbar">

<input id="search" type="text" placeholder="Pesquisar referência..." />

<select id="sort">
<option value="ref">Ordenar por referência</option>
<option value="recent">Mais recentes</option>
</select>

<button class="btn btn-ghost" id="clearBtn">
Limpar busca
</button>

</div>

<div id="grid" class="grid"></div>

<div id="empty" class="empty" style="display:none">
Nenhum modelo encontrado.
</div>

</div>

<div class="modal" id="modal">
<button class="close" id="closeModal">×</button>
<img id="modalImg">
</div>

<script>

const MODELOS = [
{
ref:"0012",
nome:"Modelo 0012",
frente:"0012-frente.jpeg",
costas:"0012-costas.jpeg",
tem_frente:true,
tem_costas:true
}
];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const searchEl = document.getElementById('search');
const sortEl = document.getElementById('sort');

const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');

function esc(text){
return String(text ?? '')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;');
}

function downloadModel(frente,costas){

if(frente){

const a1=document.createElement('a');
a1.href=frente;
a1.download='';
document.body.appendChild(a1);
a1.click();
a1.remove();

}

if(costas){

setTimeout(()=>{

const a2=document.createElement('a');
a2.href=costas;
a2.download='';
document.body.appendChild(a2);
a2.click();
a2.remove();

},500);

}

}

function cardTemplate(item){

const front=item.frente
? `<img src="${item.frente}" alt="">`
: `<span>Sem foto</span>`;

const back=item.costas
? `<img src="${item.costas}" alt="">`
: `<span>Sem foto</span>`;

return `

<article class="card">

<div class="card-top">

<div class="badge">
REF ${esc(item.ref)}
</div>

<div class="titles">
<div class="ref">${esc(item.ref)}</div>
<div class="name">${esc(item.nome)}</div>
</div>

<div class="photo-grid">

<div class="photo-box">

<div class="photo-label">
<span>Foto frente</span>
<span>${item.tem_frente ? 'ok':'sem foto'}</span>
</div>

<div class="thumb"
data-open="${item.frente || ''}">
${front}
</div>

</div>

<div class="photo-box">

<div class="photo-label">
<span>Foto costas</span>
<span>${item.tem_costas ? 'ok':'sem foto'}</span>
</div>

<div class="thumb"
data-open="${item.costas || ''}">
${back}
</div>

</div>

</div>

</div>

<div class="card-body">

<button
class="btn btn-primary"
onclick="downloadModel('${item.frente || ''}','${item.costas || ''}')">

⬇ Baixar fotos do modelo

</button>

<div class="small">
Baixa as fotos reais do modelo.
</div>

</div>

</article>

`;

}

function openModal(src){

if(!src) return;

modalImg.src=src;
modal.classList.add('open');

}

function closeModal(){

modal.classList.remove('open');
modalImg.src='';

}

function render(){

let items=[...MODELOS];

const q=searchEl.value.trim().toLowerCase();

if(q){

items=items.filter(x=>
x.ref.toLowerCase().includes(q) ||
x.nome.toLowerCase().includes(q)
);

}

if(sortEl.value==='ref'){

items.sort((a,b)=>
a.ref.localeCompare(b.ref,'pt-BR',{numeric:true})
);

}else{

items.sort((a,b)=>Number(b.ref)-Number(a.ref));

}

grid.innerHTML=items.map(cardTemplate).join('');

empty.style.display=items.length
? 'none'
: 'block';

grid.querySelectorAll('.thumb').forEach(el=>{

el.addEventListener('click',()=>{

openModal(el.dataset.open);

});

});

}

searchEl.addEventListener('input',render);

sortEl.addEventListener('change',render);

document.getElementById('clearBtn')
.addEventListener('click',()=>{

searchEl.value='';
sortEl.value='ref';

render();

});

document.getElementById('closeModal')
.addEventListener('click',closeModal);

modal.addEventListener('click',e=>{

if(e.target===modal){
closeModal();
}

});

document.addEventListener('keydown',e=>{

if(e.key==='Escape'){
closeModal();
}

});

render();

</script>

</body>
</html>
